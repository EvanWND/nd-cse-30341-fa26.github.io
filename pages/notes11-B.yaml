  ## Review: <span class="gold">Synchronization Primitives</span>

  > Issue with <strong class="success">Concurrency</strong> is that we need to
  perform **synchronization**.

  <table>
  <thead>
    <th class="info-bg">Synchronization Primitives</th>
    <th class="info-bg">Problem</th>
    <th class="info-bg">Approach</th>
  </thead>
  <tbody>
  <tr class="warning-bg">
    <td>Lock</td>
    <td>Race Condition</td>
    <td>Ownership</td>
  </tr>
  <tr class="caution-bg">
    <td>Condition Variables</td>
    <td>Busy Waiting, <strike>Deadlock</strike></td>
    <td>Ownership</td>
  </tr>
  <tr class="special-bg">
    <td>Semaphores</td>
    <td>Race Condition, Busy Waiting, <strike>Deadlock</strike></td>
    <td>Signaling</td>
  </tr>
  </tbody>
  </table>

  <div class="alert warning-bg" markdown="1">

  <strong class="caution">Condition variables</strong> and <strong
  class="special">semaphores</strong> can both help prevent <strong
  class="danger">deadlock</strong> in some cases, but they can also cause it as
  well.

  </div>

  <div class="alert success-bg" markdown="1">

  These **primitives** are like `malloc` and `free` in **data structures**...
  they are low-level mechanisms for managing resources, but they don't tell us
  how they should be used.  Therefore, we should study **patterns**.

  </div>

  ## Review: <span class="gold">Concurrency Patterns</span>

  > Which of the following [concurrency patterns] have we explored?

  <table>
  <thead>
    <th class="special-bg">Concurrency Pattern</th>
    <th class="info-bg">Description</th>
  </thead>
  <tbody>
  <tr>
    <td class="special-bg">Scheduler</td>
    <td class="info-bg">Ordering tasks</td>
  </tr>
  <tr>
    <td class="special-bg">Thread Pool</td>
