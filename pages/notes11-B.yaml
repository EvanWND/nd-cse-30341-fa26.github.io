  </tr>
  <tr>
    <td class="special-bg">Monitor</td>
    <td class="info-bg">Abstract synchronization (internally)</td>
  </tr>
  <tr>
    <td class="special-bg">Barrier</td>
    <td class="info-bg">All tasks stop at a certain point before proceeding</td>
  </tr>
  <tr>
    <td class="special-bg">Readers-Writer Lock</td>
    <td class="info-bg">Allow multiple readings, and one writer</td>
  </tr>
  <tr>
    <td class="special-bg">Producer / Consumer</td>
    <td class="info-bg">Some jobs produce data, others consume data</td>
  </tr>
  <tr>
