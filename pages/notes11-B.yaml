  ## Semaphores: <span class="gold">Overview</span>

  A <strong class="special">semaphore</strong> is a synchronization primitive
  that consists of an <strong class="caution">integer</strong> that we can
  manipulate with two <strong class="success">operations</strong>:

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  ```python
  def sem_wait(s):
      s.value--
      if s.value < 0:
          thread_wait()
  ```

  </div>

  <div class="flex-col" markdown="1">

  ```python
  def sem_post(s):
      s.value++
      if threads_waiting():
          threads_wakeup_next()
  ```

  </div>

  </div>

  <div class="alert warning-bg centered" markdown="1">

  **Semaphores** combine the **mutual exclusion** of a **lock** and the
  **signaling** of a **condition variable**.

  </div>

  <div class="alert caution-bg centered" markdown="1">

  **Observations**: Typically we do **locks** and **condition variables**
  togather and **semaphores** separately (*don't mix*).

  </div>

  ## Reading 06: <span class="gold">Rate-Limiting / Throttling</span>

  ```c
  /* Global variables */

  sem_t  Lock;
  sem_t  Running;
  size_t Failures = 0;

  int main(int argc, char *argv[]) {
      /* Initialize Semaphores */
      sem_init(&Lock, 0, 1);
      sem_init(&Running, 0, MAX_THREADS);

      /* For each argument, create thread to compute sha1sum */
      pthread_t thread[argc - 1];

      for (int i = 1; i < argc; i++) {
          // Discuss: mq_start
          pthread_create(&thread[i - 1], NULL, sha1sum_thread, argv[i]);
      }

      /* For each argument, join thread */
      for (int i = 1; i < argc; i++) {
          pthread_join(thread[i - 1], NULL);
      }

      return Failures;
  }

  void *sha1sum_thread(void *arg) {
      sem_wait(&Running);

      char cksum[SHA_DIGEST_LENGTH*2 + 1];
      char *path = (char *)arg;

      if (!sha1sum_file(path, cksum)) {
          sem_wait(&Lock);
          Failures++;
          sem_post(&Lock);
      } else {
          printf("%s  %s\n", cksum, path);
      }

      sem_post(&Running);
      return NULL;

  }
  ```

  <div class="alert warning-bg" markdown="1">

  **Observations**:

  - <strong class="danger">Critical section</strong> is region with shared data
  (`Failures`)

  - <strong class="special">Semaphores</strong> have an implicit queueing
  system (ie. *waiting*)

  -   <div class="flex-col" markdown="1">

      Can use only one <strong class="special">semaphore</strong> by:

      - Guard `thread_create` with `Running`
      - But still have dead **threads** that haven't joined... perhaps
      `pthread_detach` to allow the threads to cleanup automatically when they
      exit
      - Return `failures` to get rid of `Lock`

  </div>

  ## Semaphores: <span class="gold">Reader-Writer Locks</span>

  With <strong class="special">semaphores</strong>, we can create interesting
  synchronization objects such as <strong class="danger">reader-writer
  locks</strong>:

  - Once <strong class="success">readers</strong> acquire the <strong
    class="warning">writelock</strong>, as many <strong
    class="success">readers</strong> as possible can read the data.

  - Once a <strong class="danger">writer</strong> acquires the <strong
    class="warning">writelock</strong>, no one else can access the data.

  - Unfortunately, this can add <strong class="caution">overhead</strong> and is
    prone to <strong class="danger">starvation</strong>.

  <div class="alert success-bg" markdown="1">

  **Example**: **databases**, **GrubHub**.

  </div>

  ## Semaphores: <span class="gold">Reader Preference</span>

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  ```c
  size_t Readers    = 0
  sem_t  WriterLock = 1
  sem_t  ReaderLock = 1

  Writer():
      sem_wait(&WriterLock)
      do_write()
      sem_post(&WriterLock)
  ```

  - <strong class="success">Pro</strong>: Allows multiple readers
  - <strong class="danger">Con</strong>: Writer may starve

  </div>

  <div class="flex-col" markdown="1">

  ```c
  Reader():
      sem_wait(&ReaderLock)
      if Readers == 0:
          sem_wait(WriterLock)
      Readers++
      sem_post(&ReaderLock)

      do_read()

      sem_wait(&ReaderLock)
      Readers--
      if Readers == 0:
          sem_post(WriterLock)
      sem_post(&ReaderLock)
  ```

  </div>

  </div>

  <div class="alert caution-bg" markdown="1">

  *A bunch of people want to go party, once people with gold shirts go in...
  you don't allow blue shirts… so what do you do?*

  **Force a queue with a semaphore!**

  </div>

  ## Semaphores: <span class="gold">Fair</span>

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  ```c
  size_t Readers      = 0
  sem_t  WriterLock   = 1
  sem_t  ReaderLock   = 1
  sem_t  ServiceQueue = 1     //

  Writer():
      sem_wait(&ServiceQueue) //
      sem_wait(&WriterLock)
      sem_post(&ServiceQueue) //
      do_write()
      sem_post(&WriterLock)
  ```

  </div>

  <div class="flex-col" markdown="1">

  ```c
  Reader():
      sem_wait(&ServiceQueue) //
      sem_wait(&ReaderLock)
      if Readers == 0:
          sem_wait(WriterLock)
      Readers++
      sem_post(&ServiceQueue) //
      sem_post(&ReaderLock)

      do_read()

      sem_wait(&ReaderLock)
      Readers--
      if Readers == 0:
          sem_post(WriterLock)
      sem_post(&ReaderLock)
  ```

  </div>

  </div>

  ## Semaphores: <span class="gold">Summary</span>

  <strong class="special">Semaphores</strong> are another useful and flexible
  synchronization primitive:

  - Good when you need a <strong class="danger">barrier</strong> or want to have
    <strong class="danger">bounded</strong> access to a resource.

  - Unlike <strong class="warning">locks</strong> and <strong
    class="caution">condition variables</strong>, there is no notion of <strong
    class="primary">ownership</strong>.

  - Can avoid using <strong class="warning">locks</strong> and <strong
    class="caution">condition variables</strong> if desired.

  ## Example: <span class="gold">Salsa Night</span> (<i class="muted">Locks and Condition Variable</i>)

  ```python
  # Global Variables
  size_t MIN_FRIENDS = 2  # Minimum number of friends before we have courage
  size_t Friends     = 0  # Current number of friends brave enough

  Mutex Lock
  Cond  Dancing

  # Threads

  def thread_you_dance():
      mutex_lock(Lock)
      while Friends < MIN_FRIENDS:
          cond_wait(Dancing, Lock)
      mutex_unlock(Lock)

      dance()

  def thread_friend_dance():
      mutex_lock(Lock)
      Friends++
      cond_signal(Dancing)
      mutex_unlock(Lock)

      dance()
  ```

  <div class="alert caution-bg" markdown="1">

  **Skit**: `3` dancers...

  - Each person describes what they do
  - Act out when done
  - **Alternative**: only signal last friend

  </div>

  ## Example: <span class="gold">Salsa Night</span> (<i class="muted">Semaphores</i>)

  ```python
  # Global Variables
  size_t MIN_FRIENDS = 2  # Minimum number of friends before we have courage
  size_t Friends     = 0  # Current number of friends brave enough

  Semaphore Lock     = 1
  Semaphore Dancing  = 0

  # Threads

  def thread_you_dance():
      sem_wait(Dancing)

      dance()

  def thread_friend_dance():
      sem_wait(Lock)
      Friends++
      if Friends == MIN_FRIENDS:
          sem_post(Dancing)
      sem_post(Lock)

      dance()
  ```
