  ## Concurrent DS: <span class="gold">Producer / Consumer</span>

  In this classic <strong class="success">concurrency</strong> problem, we have
  one more <strong class="success">producers</strong> generating data that one or
  more <strong class="danger">consumers</strong> must process:

  ### Concurrent DS: <span class="gold">Producer / Consumer</span> (<i class="muted">Skit</i>)

  -   <div class="flex-col" markdown="1">

      **Producer** puts **balls** into **cups**.

      - Performs **push** (*advance writer index/pointer*).

      - Eventually runs out of space... or move back to from (*circular array*).

      - Can't **push** if **full**.

  -   <div class="flex-col" markdown="1">

      **Consumer** retrieves **balls** from **cups**.

      - Performs **pop** (*advance reader index/pointer*)

      - Need to careful to not advance *reader* past *writer*.

      - Can't **pop** if **empty**.

  <div class="alert warning-bg centered" markdown="1">

  If we have someone **consuming** and someone **producing**,<br>
  then need to **synchronize** access to the resource!

  </div>

  ### Concurrent DS: <span class="gold">Producer / Consumer</span> (<i class="muted">Pseudo-Code</i>)

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  <img src="static/img/slides10-producer-consumer.svg" class="transparent responsive">

  <br>

  <div class="alert danger-bg centered" markdown="1">

  This version is full of<br>**race conditions**!

  </div>

  </div>

  <div class="flex-col" markdown="1">

  ```python
  # Version 0 - No checks

  def Producer(queue):
      while True:
          data = produce()
          queue.push(data)

  def Consumer(queue):
      while True:
          data = queue.pop()
          consume(data)

  # Version 1 - If

  def Producer(queue):
      while True:
          data = produce()
          if not queue.full():    # Add check
              queue.push(data)

  def Consumer(queue):
      while True:
          if queue.empty():       # Add check
              data = queue.pop()
          consume(data)

  # Version 2 - While

  def Producer(queue):
      while True:
          data = produce()
          while not queue.full(): # Add busy waiting
              pass
          queue.push(data)

  def Consumer(queue):
      while True:
          while queue.empty():    # Add busy waiting
              pass
          data = queue.pop()
          consume(data)

  # Version 3 - Locks (Race Condition)

  def Producer(queue):
      while True:
          data = produce()

          while not queue.full():
              pass

          Lock()                  # Lock access to queue
          queue.push(data)
          Unlock()

  def Consumer(queue):
      while True:
          while queue.empty():
              pass

          Lock()                  # Lock access to queue
          data = queue.pop()
          Unlock()
          consume(data)

  # Version 4 - Locks (Deadlock)

  def Producer(queue):
      while True:
          data = produce()

          Lock()                  # Move lock
          while not queue.full():
              pass

          queue.push(data)
          Unlock()

  def Consumer(queue):
      while True:
          Lock()                  # Move lock
          while queue.empty():
              pass

          data = queue.pop()
          Unlock()
          consume(data)
  ```

  </div>

  </div>

  ## Concurrent DS: <span class="gold">Monitor</span>

  Solve this problem with a <strong class="primary">monitor</strong> that uses
  <strong class="warning">locks</strong> and <strong class="caution">condition
  variables</strong> internally to provide safe access to <strong
  class="danger">shared resources</strong>.

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  <img src="static/img/slides10-monitor.svg" class="transparent responsive">

  <br>

  <div class="alert success-bg centered" markdown="1">

  Abstract the details of **synchronization** behind the interface of a <strong
  class="primary">concurrent data structure</strong>.

  </div>

  </div>

  <div class="flex-col" markdown="1">

  ```python
    def push(self, data):
        mutex.lock()

        while queue.full():   # Busy Waiting
            pass

        queue.push(data)
        produced.signal()
        mutex.unlock()

    def pop(self):
        mutex.lock()

        while queue.empty():  # Busy Waiting
            pass

        data = queue.pop()
        mutex.unlock()

        return data
  ```

  <div class="alert warning-bg" markdown="1">

  **Observations**:

  - **Producer** just uses `Push()`, **Consumer** just uses `Pop()`.

  - **Problem 1**: Grab **lock** and stuck in while loop forever (*deadlock*).

  - **Problem 2**: **Busy waiting**.

  </div>

  </div>

  </div>

  ## Concurrent DS: <span class="gold">Queue</span> (<i class="muted">comments</i>)

  -   <div class="flex-col" markdown="1">

      Annotate `pc.c` (*comments*).

      - Review thread primitives (`thread.h`).
      - Discuss **sentinel value** for terminating.

  -   <div class="flex-col" markdown="1">

      Discuss `queue.h` and `queue.c`.

