title:  "Notes 09: Condition Variables"
body:   |

  ## Review: <span class="gold">Locks</span>

  - [Project 01]: We be **graded** soon...

  -   <div class="flex-col" markdown="1">

      What is a **lock**?

      - Mechanism to prevent thread from accessing **critical section** (*shared
        resource*).

      - Helps avoid **race conditions**!

  -   <div class="flex-col" markdown="1">

      How do we use a **lock**?

      - Parties agree to *acquire* lock before accessing *shared resource*.

      - If can't *acquire*, then *wait* until it is available (*mutual exclusion*).

  [Project 01]: project01.html

  ## Project 02: <span class="gold">Pub / Sub</span>

  > **Analogy**: Mobile phone subscribes to a **Pub/Sub** system to get
  **notifications**.

  <div class="centered">

  <img src="static/img/notebook10-project02-pubsub.svg" class="transparent responsive">

  </div>

  <div class="alert warning-bg centered" markdown="1">

  Need to use **library** to implement **chat application**.

